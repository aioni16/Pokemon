<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plant vs Zombies — Mini Clone</title>
  <style>
    :root {
      --bg: #132a13;
      --panel: #1f5131;
      --card: #2e7d32;
      --text: #f3ffe7;
      --accent: #ffde59;
      --danger: #f44336;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #2d6a4f, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .game-shell {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 16px;
      width: min(1100px, 100%);
      align-items: start;
    }
    canvas {
      width: 100%;
      border: 4px solid #7f4f24;
      border-radius: 12px;
      background: linear-gradient(180deg, #7cb342 0%, #558b2f 100%);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    .panel {
      background: rgba(21, 67, 37, 0.95);
      border: 2px solid #3fa34d;
      border-radius: 12px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--accent);
    }
    .stat {
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.95rem;
    }
    .cards {
      display: grid;
      gap: 8px;
    }
    .card {
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px;
      background: var(--card);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .card:hover { filter: brightness(1.1); }
    .card.selected { border-color: var(--accent); }
    .card.disabled { opacity: 0.45; cursor: not-allowed; }
    button {
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      background: #0f3d22;
      color: var(--text);
    }
    button:hover { filter: brightness(1.1); }
    .tip {
      font-size: 0.88rem;
      opacity: 0.9;
      line-height: 1.35;
    }
    .game-over {
      color: #ffd6d6;
      background: rgba(244, 67, 54, 0.24);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 8px;
      font-weight: 700;
    }
    @media (max-width: 980px) {
      .game-shell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="game" width="900" height="500"></canvas>
    <aside class="panel">
      <h1>Plant vs Zombies</h1>
      <div class="stat" id="sunCounter">☀ Sun: 150</div>
      <div class="stat" id="waveCounter">🧟 Wave: 1</div>
      <div class="cards" id="cards"></div>
      <button id="shovelBtn">Shovel Mode: Off</button>
      <button id="restartBtn">Restart</button>
      <div class="tip">
        Pick a card, then click a tile to plant.<br>
        <strong>Peashooter</strong> attacks zombies in its lane.<br>
        <strong>Sunflower</strong> generates sun automatically.<br>
        <strong>Wall-nut</strong> blocks zombies.
      </div>
      <div id="status"></div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const ROWS = 5;
    const COLS = 9;
    const TILE_W = 100;
    const TILE_H = 100;

    const CARD_DATA = {
      peashooter: { name: 'Peashooter', cost: 100, color: '#4caf50' },
      sunflower: { name: 'Sunflower', cost: 50, color: '#ffeb3b' },
      wallnut: { name: 'Wall-nut', cost: 75, color: '#8d6e63' },
    };

    const state = {
      sun: 150,
      wave: 1,
      gameOver: false,
      win: false,
      selectedPlant: null,
      shovelMode: false,
      plants: [],
      zombies: [],
      peas: [],
      nextZombieIn: 180,
      totalSpawned: 0,
      spawnLimit: 50,
      frame: 0,
    };

    const ui = {
      sunCounter: document.getElementById('sunCounter'),
      waveCounter: document.getElementById('waveCounter'),
      status: document.getElementById('status'),
      cards: document.getElementById('cards'),
      shovelBtn: document.getElementById('shovelBtn'),
      restartBtn: document.getElementById('restartBtn'),
    };

    function initCards() {
      ui.cards.innerHTML = '';
      for (const [id, plant] of Object.entries(CARD_DATA)) {
        const btn = document.createElement('button');
        btn.className = 'card';
        btn.dataset.plant = id;
        btn.innerHTML = `<span>${plant.name}</span><span>☀ ${plant.cost}</span>`;
        btn.addEventListener('click', () => {
          if (state.gameOver) return;
          state.selectedPlant = id;
          state.shovelMode = false;
          updateCardStyles();
        });
        ui.cards.appendChild(btn);
      }
      updateCardStyles();
    }

    function updateCardStyles() {
      [...ui.cards.children].forEach((el) => {
        const plant = CARD_DATA[el.dataset.plant];
        el.classList.toggle('selected', state.selectedPlant === el.dataset.plant && !state.shovelMode);
        el.classList.toggle('disabled', state.sun < plant.cost || state.gameOver);
      });
      ui.shovelBtn.textContent = `Shovel Mode: ${state.shovelMode ? 'On' : 'Off'}`;
      ui.shovelBtn.style.background = state.shovelMode ? '#8b1e3f' : '#0f3d22';
    }

    ui.shovelBtn.addEventListener('click', () => {
      if (state.gameOver) return;
      state.shovelMode = !state.shovelMode;
      if (state.shovelMode) state.selectedPlant = null;
      updateCardStyles();
    });

    ui.restartBtn.addEventListener('click', resetGame);

    canvas.addEventListener('click', (e) => {
      if (state.gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);

      const col = Math.floor(x / TILE_W);
      const row = Math.floor(y / TILE_H);
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

      const idx = state.plants.findIndex((p) => p.row === row && p.col === col);

      if (state.shovelMode) {
        if (idx >= 0) state.plants.splice(idx, 1);
        return;
      }

      const plantId = state.selectedPlant;
      if (!plantId || idx >= 0) return;

      const data = CARD_DATA[plantId];
      if (state.sun < data.cost) return;

      state.sun -= data.cost;
      state.plants.push({
        id: plantId,
        row,
        col,
        x: col * TILE_W + TILE_W / 2,
        y: row * TILE_H + TILE_H / 2,
        hp: plantId === 'wallnut' ? 800 : 300,
        attackCooldown: 0,
        sunCooldown: 0,
      });
      updateCardStyles();
    });

    function spawnZombie() {
      const row = Math.floor(Math.random() * ROWS);
      const speed = 0.26 + Math.random() * 0.2 + state.wave * 0.02;
      const hp = 180 + state.wave * 15;
      state.zombies.push({
        row,
        x: canvas.width + 20,
        y: row * TILE_H + TILE_H / 2,
        hp,
        maxHp: hp,
        speed,
        damageTick: 0,
      });
      state.totalSpawned += 1;
      state.wave = 1 + Math.floor(state.totalSpawned / 8);
    }

    function update() {
      if (state.gameOver) return;
      state.frame++;

      if (state.totalSpawned < state.spawnLimit) {
        state.nextZombieIn--;
        if (state.nextZombieIn <= 0) {
          spawnZombie();
          state.nextZombieIn = Math.max(35, 175 - state.wave * 8);
        }
      } else if (state.zombies.length === 0) {
        state.gameOver = true;
        state.win = true;
      }

      for (const plant of state.plants) {
        if (plant.id === 'peashooter') {
          plant.attackCooldown--;
          const hasTarget = state.zombies.some((z) => z.row === plant.row && z.x > plant.x - 20);
          if (hasTarget && plant.attackCooldown <= 0) {
            state.peas.push({ x: plant.x + 24, y: plant.y, row: plant.row, damage: 28 });
            plant.attackCooldown = 42;
          }
        }
        if (plant.id === 'sunflower') {
          plant.sunCooldown--;
          if (plant.sunCooldown <= 0) {
            state.sun += 25;
            plant.sunCooldown = 360;
          }
        }
      }

      for (const pea of state.peas) pea.x += 5.8;
      state.peas = state.peas.filter((pea) => pea.x < canvas.width + 40);

      for (const zombie of state.zombies) {
        const biteTarget = state.plants.find((p) => p.row === zombie.row && Math.abs(p.x - zombie.x) < 45);
        if (biteTarget) {
          zombie.damageTick++;
          if (zombie.damageTick % 25 === 0) biteTarget.hp -= 30;
        } else {
          zombie.x -= zombie.speed;
        }

        if (zombie.x < 10) {
          state.gameOver = true;
          state.win = false;
        }
      }

      for (const pea of state.peas) {
        const hit = state.zombies.find((z) => z.row === pea.row && Math.abs(z.x - pea.x) < 28);
        if (hit) {
          hit.hp -= pea.damage;
          pea.x = canvas.width + 200;
        }
      }

      state.plants = state.plants.filter((p) => p.hp > 0);
      state.zombies = state.zombies.filter((z) => z.hp > 0);

      ui.sunCounter.textContent = `☀ Sun: ${state.sun}`;
      ui.waveCounter.textContent = `🧟 Wave: ${state.wave}`;
      updateCardStyles();
    }

    function drawGrid() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * TILE_W;
          const y = r * TILE_H;
          ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
          ctx.fillRect(x, y, TILE_W, TILE_H);
          ctx.strokeStyle = 'rgba(0,0,0,0.2)';
          ctx.strokeRect(x, y, TILE_W, TILE_H);
        }
      }
    }

    function drawPlants() {
      for (const p of state.plants) {
        ctx.save();
        ctx.translate(p.x, p.y);

        if (p.id === 'peashooter') {
          ctx.fillStyle = '#2e7d32';
          ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#43a047';
          ctx.beginPath(); ctx.arc(18, -4, 12, 0, Math.PI * 2); ctx.fill();
        }
        if (p.id === 'sunflower') {
          ctx.fillStyle = '#ffca28';
          for (let i = 0; i < 10; i++) {
            const a = (Math.PI * 2 * i) / 10;
            ctx.beginPath(); ctx.arc(Math.cos(a) * 18, Math.sin(a) * 18, 8, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = '#6d4c41';
          ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
        }
        if (p.id === 'wallnut') {
          ctx.fillStyle = '#8d6e63';
          ctx.beginPath(); ctx.ellipse(0, 0, 25, 32, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(-8, -4, 16, 3);
        }

        const hpPct = Math.max(0, p.hp / (p.id === 'wallnut' ? 800 : 300));
        ctx.fillStyle = '#00000055';
        ctx.fillRect(-24, 34, 48, 6);
        ctx.fillStyle = '#6eff6e';
        ctx.fillRect(-24, 34, 48 * hpPct, 6);
        ctx.restore();
      }
    }

    function drawZombies() {
      for (const z of state.zombies) {
        ctx.save();
        ctx.translate(z.x, z.y);

        ctx.fillStyle = '#607d8b';
        ctx.fillRect(-14, -18, 28, 36);
        ctx.fillStyle = '#9ccc65';
        ctx.beginPath(); ctx.arc(0, -26, 13, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#000';
        ctx.fillRect(-7, -30, 3, 3);
        ctx.fillRect(4, -30, 3, 3);

        ctx.fillStyle = '#00000044';
        ctx.fillRect(-20, 28, 40, 6);
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(-20, 28, 40 * (z.hp / z.maxHp), 6);

        ctx.restore();
      }
    }

    function drawPeas() {
      ctx.fillStyle = '#8bc34a';
      for (const pea of state.peas) {
        ctx.beginPath();
        ctx.arc(pea.x, pea.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawOverlay() {
      if (!state.gameOver) {
        ui.status.innerHTML = '';
        return;
      }
      const message = state.win ? 'You survived all waves! 🌻' : 'The zombies ate your brains!';
      ui.status.innerHTML = `<div class="game-over">${message}</div>`;

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 52px system-ui';
      ctx.fillText(state.win ? 'YOU WIN' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '22px system-ui';
      ctx.fillText('Press Restart to play again', canvas.width / 2, canvas.height / 2 + 35);
      ctx.textAlign = 'left';
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawPlants();
      drawPeas();
      drawZombies();
      drawOverlay();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      Object.assign(state, {
        sun: 150,
        wave: 1,
        gameOver: false,
        win: false,
        selectedPlant: null,
        shovelMode: false,
        plants: [],
        zombies: [],
        peas: [],
        nextZombieIn: 120,
        totalSpawned: 0,
        spawnLimit: 50,
        frame: 0,
      });
      updateCardStyles();
      ui.status.innerHTML = '';
    }

    initCards();
    resetGame();
    gameLoop();
  </script>
</body>
</html>
